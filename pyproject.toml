[tool.poetry]
name = "taxi-driver"
version = "0.1.0"
description = "Model-free episodic RL agents solving Gymnasium Taxi-v3 (Epitech T-AIA-902)"
authors = ["T-AIA-902 Taxi-Driver team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/T-AIA-902-Taxi-Driver/Taxi-Driver"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# Taxi-v3 was removed in gymnasium 1.3.0 (replaced by Taxi-v4, which is identical with
# default parameters); the subject mandates Taxi-v3, hence the <1.3 pin.
gymnasium = ">=1.0,<1.3"
numpy = ">=1.24,<2.0"
matplotlib = ">=3.7"
seaborn = ">=0.12"
pandas = ">=2.0"
scipy = ">=1.10"
pyyaml = ">=6.0"
tqdm = ">=4.65"
imageio = ">=2.30"
pygame = ">=2.1.3"
torch = ">=2.2,<2.6"
stable-baselines3 = { version = ">=2.4", optional = true }

[tool.poetry.extras]
# TrackMania deep-RL extension (see docs/TRACKMANIA.md). `tmrl` itself must be installed
# manually on the Windows machine running the game; it is not locked here.
trackmania = ["stable-baselines3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.3"
black = ">=24.0"
mypy = ">=1.9"
types-PyYAML = ">=6.0"
pre-commit = ">=3.5"

[tool.poetry.scripts]
taxi-driver = "src.main:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E501: line length is enforced by black (strings/comments excepted by convention)
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "seaborn.*",
    "scipy.*",
    "pandas.*",
    "imageio.*",
    "tmrl.*",
    "stable_baselines3.*",
    "gymnasium.envs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: long-running training tests (excluded by default, run with -m slow)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "src/environments/trackmania_wrapper.py"]
