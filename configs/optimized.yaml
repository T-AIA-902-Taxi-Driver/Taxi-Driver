# Optimized configuration (time-limited mode).
# Grid-search E1a: 15/20 configurations reach the optimal policy (reward 8.05 = R*); ties broken by convergence speed -> alpha=0.30, gamma=0.95 (mean episodes-to-threshold 980, n=10).
algorithm: q_learning
env: taxi
mode: time_limited
seed: 42
n_train_episodes: 15000
n_test_episodes: 100
max_steps_per_episode: 200
time_budget: 60.0
alpha: 0.3
gamma: 0.95
exploration: epsilon_greedy
epsilon: 1.0
epsilon_min: 0.01
epsilon_decay: 0.9995
decay_type: exp
decay_frac: 0.6
temperature: 1.0
temperature_min: 0.05
temperature_decay: 0.999
ucb_c: 2.0
reward_shaping: none
lr: 0.001
batch_size: 64
hidden_size: 128
buffer_capacity: 50000
warmup_steps: 1000
train_every: 1
tau: 0.005
double_dqn: true
grad_clip: 10.0
device: auto
early_stopping: false
patience: 500
target_reward: 8.0
eval_interval: 100
n_probe_episodes: 30
model_path: models
results_dir: results
